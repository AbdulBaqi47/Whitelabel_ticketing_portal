openapi: 3.0.0
info:
  title: Book Air Ticket.pk
  description: Comprehensive API's For Flight Booking And Management System
  version: 1.0.0
servers:
  - url: /api/v1
    description: API base URL

tags:
  - name: Authentication
  - name: User
  - name: Settings
  - name: Flight
  - name: Booking
  - name: Organization
  - name: Dashboard
  - name: Financial
  - name: References
  - name: Bank Accounts
  - name: Connectors
  - name: Suppliers
  - name: Airlines
  - name: Airports
  - name: Countries
  - name: Cities
  - name: News & Alerts
  - name: Margins
  - name: Agents
  - name: Refunds
  - name: Deposits
  - name: Passport
  - name: Account
  - name: Miscellaneous

paths:
  /hello:
    get:
      tags: [Miscellaneous]
      summary: Returns a greeting
      responses:
        "200":
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello World!

  /user:
    get:
      tags: [User]
      summary: Get authenticated user details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ==================== AUTH ROUTES ====================
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  { type: string, format: email, example: "user@example.com" }
                password:
                  { type: string, format: password, example: "password123" }
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }

  /auth/re-send:
    post:
      tags: [Authentication]
      summary: Resend OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  { type: string, format: email, example: "user@example.com" }
      responses:
        "200":
          description: OTP resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /auth/verify:
    post:
      tags: [Authentication]
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  { type: string, format: email, example: "user@example.com" }
                otp: { type: string, example: "123456" }
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  { type: string, format: email, example: "user@example.com" }
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                email:
                  { type: string, format: email, example: "user@example.com" }
                password:
                  { type: string, format: password, example: "newpassword123" }
                password_confirmation:
                  { type: string, format: password, example: "newpassword123" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /auth/admin-change-password:
    post:
      tags: [Authentication]
      summary: Change password (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  { type: string, format: password, example: "oldpassword123" }
                new_password:
                  { type: string, format: password, example: "newpassword123" }
                new_password_confirmation:
                  { type: string, format: password, example: "newpassword123" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ==================== USER PROFILE ROUTES ====================
  /user-profile:
    get:
      tags: [User]
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /update-profile:
    patch:
      tags: [User]
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /update-password:
    patch:
      tags: [User]
      summary: Update user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
                new_password_confirmation: { type: string, format: password }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /permission-list/{uuid}:
    get:
      tags: [User]
      summary: Get permission list for user
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { type: array, items: { type: string } }

  /update-permission/{uuid}:
    post:
      tags: [User]
      summary: Update user permissions
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        "200":
          description: Permissions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ==================== SETTINGS ROUTES ====================
  /setting/general-setting:
    post:
      tags: [Settings]
      summary: Update general settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { type: object }
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /setting/temporary-limit:
    post:
      tags: [Settings]
      summary: Set temporary limit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: number }
                duration: { type: string }
      responses:
        "200":
          description: Limit set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /setting/finanical-profile:
    get:
      tags: [Settings]
      summary: Get financial profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Financial data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfile"

  # ==================== FLIGHT ROUTES ====================
  /flight/search:
    post:
      tags: [Flight]
      summary: Search flights
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightSearch"
      responses:
        "200":
          description: Flight results
          content:
            application/json:
              schema:
                type: object
                properties:
                  flights:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Flight" },
                    }

  /flight/pricing/{price_id}:
    get:
      tags: [Flight]
      summary: Get flight pricing
      security:
        - bearerAuth: []
      parameters:
        - name: price_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pricing info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightPricing"

  /flight/initiating/fly-jinnah:
    post:
      tags: [Flight]
      summary: Initiate FlyJinnah booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightBooking"
      responses:
        "200":
          description: Booking initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /flight/baggage-selection:
    post:
      tags: [Flight]
      summary: Select baggage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaggageSelection"
      responses:
        "200":
          description: Baggage selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /flight/seat-selection:
    post:
      tags: [Flight]
      summary: Select seats
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatSelection"
      responses:
        "200":
          description: Seats selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /flight/meal-selection:
    post:
      tags: [Flight]
      summary: Select meals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealSelection"
      responses:
        "200":
          description: Meals selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /flight/flydubai-anci:
    post:
      tags: [Flight]
      summary: FlyDubai ANCI selection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlyDubaiAnci"
      responses:
        "200":
          description: ANCI selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /flight/flydubai-seat-offers:
    post:
      tags: [Flight]
      summary: FlyDubai seat offers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatSelection"
      responses:
        "200":
          description: Seat offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /import-pnr:
    post:
      tags: [Flight]
      summary: Import PNR
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pnr: { type: string }
      responses:
        "200":
          description: PNR imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  # ==================== BOOKING ROUTES ====================
  /booking/initiating:
    post:
      tags: [Booking]
      summary: Initiate booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightBooking"
      responses:
        "200":
          description: Booking initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /booking/confirm-availability:
    get:
      tags: [Booking]
      summary: Confirm availability
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Availability confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }

  /booking/booking-confirm:
    post:
      tags: [Booking]
      summary: Confirm booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingConfirm"
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"

  /booking/get-booking:
    post:
      tags: [Booking]
      summary: Get booking details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetails"

  /booking/cancel-booking:
    post:
      tags: [Booking]
      summary: Cancel booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/issue-ticket:
    post:
      tags: [Booking]
      summary: Issue ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
      responses:
        "200":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/getById/{id}:
    get:
      tags: [Booking]
      summary: Get booking by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetails"

  /booking/void-ticket:
    post:
      tags: [Booking]
      summary: Void ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
                ticket_number: { type: string }
      responses:
        "200":
          description: Ticket voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/flydubai-void:
    post:
      tags: [Booking]
      summary: Void FlyDubai booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
      responses:
        "200":
          description: Booking voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/search:
    post:
      tags: [Booking]
      summary: Search bookings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search_term: { type: string }
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
      responses:
        "200":
          description: Booking search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/BookingDetails" },
                    }

  /booking/email-booking:
    post:
      tags: [Booking]
      summary: Email booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Booking emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/ticket-otp-email:
    get:
      tags: [Booking]
      summary: Get ticket OTP email
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/download-booking:
    post:
      tags: [Booking]
      summary: Download booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
      responses:
        "200":
          description: Booking downloaded
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /booking/bookings-list:
    get:
      tags: [Booking]
      summary: List bookings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/BookingDetails" },
                    }

  /booking/refund-booking:
    post:
      tags: [Booking]
      summary: Refund booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id: { type: string }
      responses:
        "200":
          description: Booking refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /booking/import-booking:
    post:
      tags: [Booking]
      summary: Import booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pnr: { type: string }
      responses:
        "200":
          description: Booking imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetails"

  # ==================== BANK ACCOUNT ROUTES ====================
  /settings/bank-account/index:
    get:
      tags: [Bank Accounts]
      summary: List bank accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bank accounts list
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/BankAccount" },
                    }

  /settings/bank-account/store:
    post:
      tags: [Bank Accounts]
      summary: Create bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountCreate"
      responses:
        "200":
          description: Bank account createde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"

  /settings/bank-account/update/{uuid}:
    put:
      tags: [Bank Accounts]
      summary: Update bank account
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountCreate"
      responses:
        "200":
          description: Bank account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"

  /settings/bank-account/show/{uuid}:
    get:
      tags: [Bank Accounts]
      summary: Get bank account details
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bank account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"

  /settings/bank-account/delete/{uuid}:
    get:
      tags: [Bank Accounts]
      summary: Delete bank account
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bank account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /settings/bank-account/list:
    get:
      tags: [Bank Accounts]
      summary: Get bank list
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bank list
          content:
            application/json:
              schema:
                type: object
                properties:
                  banks:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Bank" },
                    }

  /settings/bank-account/drop-down:
    get:
      tags: [Bank Accounts]
      summary: Get bank dropdown
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bank dropdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  banks:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Bank" },
                    }

  # ==================== CONNECTOR ROUTES ====================
  /settings/connector/update:
    post:
      tags: [Connectors]
      summary: Update connector
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdate"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /settings/connector/status/{type}:
    patch:
      tags: [Connectors]
      summary: Change connector status
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: boolean }
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /settings/connector/show/{type}:
    get:
      tags: [Connectors]
      summary: Get connector details
