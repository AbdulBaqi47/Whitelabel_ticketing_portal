components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        avatar: { type: string, format: binary, nullable: true }

    FinancialProfile:
      type: object
      properties:
        balance: { type: number, format: float }
        credit_limit: { type: number, format: float }
        temporary_limit: { type: number, format: float, nullable: true }
        temporary_limit_expiry:
          { type: string, format: date-time, nullable: true }

    FlightSearch:
      type: object
      properties:
        origin: { type: string }
        destination: { type: string }
        departure_date: { type: string, format: date }
        return_date: { type: string, format: date, nullable: true }
        adults: { type: integer }
        children: { type: integer, nullable: true }
        infants: { type: integer, nullable: true }
        cabin_class:
          { type: string, enum: [economy, premium_economy, business, first] }
